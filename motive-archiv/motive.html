<!-- ============================================================
     Die vier Motive als HTML. Jedes ist ein leeres <span>, das
     Bild kommt per background-position aus dem Sprite. Sie
     gehoeren jeweils als ERSTES Kind direkt hinter das
     oeffnende <section>-Tag, noch vor <div class="sec-head">.
     ============================================================ -->


<!-- In index.html, Sektion "Lösungen" -->
<section class="sec" id="loesungen" data-halt data-seite="center" data-karten>
  <span class="kartenmotiv motiv-berge" aria-hidden="true"></span>
  <span class="kartenmotiv motiv-kompass" aria-hidden="true"></span>
  <div class="sec-head">


<!-- In index.html, Sektion "Über uns" -->
<section class="sec" id="ueber-uns" data-halt data-seite="left">
  <span class="kartenmotiv motiv-anker" aria-hidden="true"></span>
  <div class="sec-head">


<!-- In index.html, Sektion "So geht es weiter" -->
<section class="sec" id="kontakt" data-halt data-seite="center" data-ziel>
  <span class="kartenmotiv motiv-truhe" aria-hidden="true"></span>
  <div class="sec-head">
